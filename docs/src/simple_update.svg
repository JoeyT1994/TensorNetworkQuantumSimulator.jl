<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 175" width="100%" height="100%">
<defs>
  <style>
    .card { fill: #E6E7E8; }
    .title { font-family: Georgia, 'Times New Roman', Times, serif; font-size: 14px; font-weight: bold; fill: #111111; text-decoration: underline; text-anchor: middle; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #333333; text-anchor: middle; }
    .code-label { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10.5px; fill: #222222; text-anchor: middle; }
    .math-label { font-family: Georgia, 'Times New Roman', Times, serif; font-size: 12px; font-style: italic; fill: #111111; text-anchor: middle; }
    .small-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #333333; text-anchor: middle; }
    .bond { stroke: #231F20; stroke-width: 2; stroke-linecap: round; fill: none; }
    .faint-bond { stroke: #B8BABC; stroke-width: 1.5; stroke-dasharray: 3,3; fill: none; }
    .phys-leg { stroke: #656565; stroke-width: 1.8; stroke-dasharray: 2.2,2.2; fill: none; }
    .cut-bond { stroke: #B12225; stroke-width: 2.2; stroke-dasharray: 3,2.5; fill: none; }
    .site-node { fill: #9696CA; stroke: #231F20; stroke-width: 2; }
    .active-node { fill: #374A9F; stroke: #231F20; stroke-width: 2; }
    .msg-node { fill: #C5C5C5; stroke: #231F20; stroke-width: 1.8; }
    .corner-node { fill: #E8D5B7; stroke: #231F20; stroke-width: 1.8; }
    .gate-box { fill: #ECF5E8; stroke: #231F20; stroke-width: 1.8; }
  </style>
</defs>
<rect class="card" x="6" y="10" width="172" height="155" rx="12" ry="12"/>
<text class="title" style="font-size: 12.5px;" x="92.0" y="32">1. Absorb √m</text>
<text class="small-label" x="92.0" y="160">Gauge local tensors</text>
<line x1="181" y1="87.5" x2="192" y2="87.5" stroke="#8C8E91" stroke-width="2.5"/>
<polygon points="192,83.0 198,87.5 192,92.0" fill="#8C8E91"/>
<rect class="card" x="200" y="10" width="172" height="155" rx="12" ry="12"/>
