<circle class="site-node" cx="347" cy="76" r="9.5"/>
<polygon points="256,67 274,76 256,85" fill="#374A9F" stroke="#231F20" stroke-width="1.8"/>
<polygon points="316,67 298,76 316,85" fill="#374A9F" stroke="#231F20" stroke-width="1.8"/>
