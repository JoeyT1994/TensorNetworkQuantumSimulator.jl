<text class="small-label" x="286.0" y="160">Isolate bond core R₁R₂</text>
<line x1="375" y1="87.5" x2="386" y2="87.5" stroke="#8C8E91" stroke-width="2.5"/>
<polygon points="386,83.0 392,87.5 386,92.0" fill="#8C8E91"/>
<rect class="card" x="394" y="10" width="172" height="155" rx="12" ry="12"/>
