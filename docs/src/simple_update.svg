<text class="small-label" x="480.0" y="160">Split into R₁' · S · R₂'</text>
<line x1="569" y1="87.5" x2="580" y2="87.5" stroke="#8C8E91" stroke-width="2.5"/>
<polygon points="580,83.0 586,87.5 580,92.0" fill="#8C8E91"/>
<rect class="card" x="588" y="10" width="166" height="155" rx="12" ry="12"/>
<text class="title" style="font-size: 12.5px;" x="671.0" y="32">4. Ungauge &amp; Update</text>
