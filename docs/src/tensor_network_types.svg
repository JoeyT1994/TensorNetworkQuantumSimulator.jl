      .loop-bond { stroke: #B12225; stroke-width: 3.0; stroke-linecap: round; fill: none; }
      .node-state { fill: #9696CA; stroke: #231F20; stroke-width: 2; }
      .node-active { fill: #374A9F; stroke: #231F20; stroke-width: 2; }
      .node-msg { fill: #C5C5C5; stroke: #231F20; stroke-width: 1.8; }
      .node-corner { fill: #E8D4B4; stroke: #231F20; stroke-width: 1.8; }
      .gate-box { fill: #ECF5E8; stroke: #231F20; stroke-width: 1.8; rx: 4px; ry: 4px; }
    </style>
