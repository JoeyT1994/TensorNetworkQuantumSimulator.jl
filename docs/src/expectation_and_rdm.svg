<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 225" width="100%">
  <defs>
    <style>
      .card { fill: #E6E7E8; rx: 12px; ry: 12px; }
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 15px; fill: #111111; text-anchor: middle; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; font-size: 11.5px; fill: #333333; text-anchor: middle; }
      .code { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #231F20; text-anchor: middle; }
      .label { font-family: Georgia, 'Times New Roman', serif; font-size: 12px; fill: #111111; text-anchor: middle; }
      .small-label { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; font-size: 10px; fill: #231F20; text-anchor: middle; }
      .bond { stroke: #231F20; stroke-width: 2.2; stroke-linecap: round; fill: none; }
      .bond-back { stroke: #4A4A4A; stroke-width: 1.9; stroke-linecap: round; fill: none; }
      .bond-light { stroke: #999999; stroke-width: 1.5; stroke-dasharray: 3,3; fill: none; }
      .phys { stroke: #6E6E6E; stroke-width: 1.8; stroke-dasharray: 2.5,2.5; fill: none; }
      .phys-open { stroke: #B12225; stroke-width: 2.0; stroke-dasharray: 2.5,2.5; fill: none; }
      .cut { stroke: #B12225; stroke-width: 2.2; stroke-dasharray: 3.5,3; fill: none; }
      .loop-bond { stroke: #B12225; stroke-width: 3.0; stroke-linecap: round; fill: none; }
      .node-state { fill: #9696CA; stroke: #231F20; stroke-width: 2; }
      .node-active { fill: #374A9F; stroke: #231F20; stroke-width: 2; }
      .node-msg { fill: #C5C5C5; stroke: #231F20; stroke-width: 1.8; }
      .node-corner { fill: #E8D4B4; stroke: #231F20; stroke-width: 1.8; }
      .gate-box { fill: #ECF5E8; stroke: #231F20; stroke-width: 1.8; rx: 4px; ry: 4px; }
    </style>
